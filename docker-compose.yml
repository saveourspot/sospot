services:
  db:
    image: postgres:16-alpine
    container_name: sospot-db
    environment:
      POSTGRES_DB: sospot
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d sospot"]
      interval: 5s
      retries: 5

volumes:
  pgdata: