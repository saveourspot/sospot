services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sospot}
      POSTGRES_USER: ${DB_USER:-sospot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sospot

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-sospot}
      DB_USER: ${DB_USER:-sospot}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      LLM_GOOGLE_API_KEY: ${LLM_GOOGLE_API_KEY:-}
      LLM_PER_IP_REQUESTS_PER_MINUTE: ${LLM_PER_IP_REQUESTS_PER_MINUTE:-3}
      LLM_DAILY_MODEL_CALLS: ${LLM_DAILY_MODEL_CALLS:-200}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sospot

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-12020}:80"
    depends_on:
      - backend
    networks:
      - sospot

volumes:
  postgres_data:

networks:
  sospot:
