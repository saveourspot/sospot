spring:
  application:
    name: sospot
  profiles:
    active: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

llm:
  cache-ttl-minutes: 60
  google:
    base-url: https://generativelanguage.googleapis.com/v1beta
    model: gemini-3.6-flash
    api-key: ${LLM_GOOGLE_API_KEY:}
    timeout: 60s
    max-tool-hops: 3

logging:
  level:
    org.hibernate.SQL: debug