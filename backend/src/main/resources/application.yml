spring:
  application:
    name: sospot
  profiles:
    active: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

llm:
  cache-ttl-minutes: 60

logging:
  level:
    org.hibernate.SQL: debug