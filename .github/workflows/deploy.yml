name: SOSpot CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sospot-production
  cancel-in-progress: true

jobs:
  test-backend:
    name: Backend compile and unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Compile backend
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew compileJava --no-daemon

      - name: Run database-independent unit tests
        working-directory: backend
        run: |
          ./gradlew test \
            --tests org.example.sospot.ai.AiFallbackServiceTest \
            --tests org.example.sospot.ai.AiCostControlServiceTest \
            --no-daemon

  test-frontend:
    name: Frontend build and lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

  deploy:
    name: Deploy to Daisy
    needs:
      - test-backend
      - test-frontend
    runs-on: self-hosted

    steps:
      - name: Update repository
        working-directory: /home/jaemin/apps/sospot
        run: |
          git fetch origin main
          git pull --ff-only origin main

      - name: Build and restart containers
        working-directory: /home/jaemin/apps/sospot
        run: |
          docker compose \
            --env-file .env \
            -f docker-compose.prod.yml \
            up -d --build

      - name: Show container status
        working-directory: /home/jaemin/apps/sospot
        run: |
          docker compose \
            --env-file .env \
            -f docker-compose.prod.yml \
            ps

      - name: Verify deployment
        working-directory: /home/jaemin/apps/sospot
        run: |
          health_host=$(sed -n 's/^APP_BIND_ADDRESS=//p' .env | tail -n 1)
          health_port=$(sed -n 's/^APP_PORT=//p' .env | tail -n 1)
          : "${health_host:=127.0.0.1}"
          : "${health_port:=12020}"

          if [ "$health_host" = "0.0.0.0" ]; then
            health_host=127.0.0.1
          fi

          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error \
              "http://${health_host}:${health_port}/" > /dev/null; then
              echo "SOSpot deployment succeeded."
              exit 0
            fi

            echo "Waiting for SOSpot... ($attempt/12)"
            sleep 5
          done

          echo "SOSpot deployment health check failed."
          exit 1
